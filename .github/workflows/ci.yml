name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (PostgreSQL + Tesseract)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mda
          POSTGRES_PASSWORD: mda
          POSTGRES_DB: mda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mda -d mda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://mda:mda@localhost:5432/mda_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Tesseract (for the real OCR test)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install dependencies (same pins as production)
        run: pip install -r requirements.txt
      - name: Run tests (migrations are applied by the test setup)
        run: python -m pytest -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high


  docker:
    name: Backend Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t med-doc-assist-api backend
